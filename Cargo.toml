[workspace]
resolver = "2"
members = [
    "apps/fadb-desktop",
    "crates/fadb-domain",
    "crates/fadb-adb",
    "crates/fadb-device",
    "crates/fadb-application",
    "crates/fadb-scrcpy",
    "crates/fadb-test-support", "crates/fadb-ai",
]

[workspace.package]
version = "0.8.11"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/yeqing17/fadb"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false }
async-trait = "0.1.91"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1.9"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg"] }
mp4 = "0.14.0"
openh264 = "0.9.8"
quick-xml = "0.38.3"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.28"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
vt100 = "0.16.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
# "system-proxy" reads the OS proxy settings (Windows registry / macOS
# configuration); without it reqwest only honors proxy environment vars.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "system-proxy"] }
egui_plot = "0.34.1"

[workspace.lints.rust]
# "deny" rather than "forbid": apps/fadb-desktop/src/platform.rs is the
# single, reviewed FFI surface (DWM window chrome) and opts back in locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# "Fadb" is the project's proper noun and appears throughout doc
# comments; backticking every occurrence adds noise without value.
doc_markdown = "allow"
