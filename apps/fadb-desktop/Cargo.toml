[package]
name = "fadb"
description = "A featherweight ADB toolbox: a pure-Rust, cross-platform desktop GUI for inspecting and managing Android devices."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
arboard.workspace = true
fadb-adb = { path = "../../crates/fadb-adb", version = "0.8.11" }
fadb-ai = { path = "../../crates/fadb-ai", version = "0.8.11" }
fadb-device = { path = "../../crates/fadb-device", version = "0.8.11" }
fadb-domain = { path = "../../crates/fadb-domain", version = "0.8.11" }
fadb-scrcpy = { path = "../../crates/fadb-scrcpy", version = "0.8.11" }
fadb-test-support = { path = "../../crates/fadb-test-support", version = "0.8.11" }
eframe.workspace = true
futures-util.workspace = true
image.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
vt100.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15.4"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
semver.workspace = true
# Update downloads are hashed while streaming and checked against the
# release's published SHA256SUMS manifest before the swap is allowed.
sha2.workspace = true
egui_plot.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/fadb.ico as the exe file icon (Explorer, taskbar default).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Native window chrome (DWM rounded corners + shadow for the undecorated
# window); see src/platform.rs — the workspace's only FFI surface.
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
] }

[lints]
workspace = true
